name: Publish to PyPI

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "Setting version to $VERSION"
        sed -E -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
        sed -E -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" safesched/__init__.py
        git --no-pager diff -- pyproject.toml safesched/__init__.py || true

    - name: Commit and push version changes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add pyproject.toml safesched/__init__.py
          git commit -m "chore: sync version $VERSION from tag $TAG"
          git tag -f "$TAG"
          git push --force origin "refs/tags/$TAG"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install build twine

    - name: Build distribution
      run: python -m build

    - name: Check package metadata
      run: python -m twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
