[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safesched"
version = "0.1.1"
authors = [
  { name="Misaka14766", email="misaka14766@gmail.com" }
]
description = "安全的资源感知任务调度器，永远不会把你的机器跑崩"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "psutil>=5.8.0",
]

[project.scripts]
safesched = "safesched.cli:main"

[project.urls]
"Homepage" = "https://github.com/Misaka14766/safesched"
"Bug Tracker" = "https://github.com/Misaka14766/safesched/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-mock>=3.6",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v"
testpaths = ["tests"]
python_files = ["test_*.py"]